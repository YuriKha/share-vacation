<div class="container ">
    <div class="row justify-content-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
      <div class="col-12 text-center">
        <h1>Enter the details of your holiday</h1>
      </div>
    </div>
    <div class="row justify-content-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
      <div class="col-md-4">
        <form [formGroup]='addForm' (ngSubmit)="onSubmit()">
          <div class="form-group">
            <div class="col-md-12 text-center ">
              <label>First name:</label>
              <input type="text" class="form-control" name="firstname" formControlName="firstname">
            </div>
          </div>
          <div class="form-group">
            <div class="col-md-12 text-center">
              <label>Last name:</label>
              <input type="text" class="form-control" name="lastname" formControlName="lastname">
            </div>
          </div>
          <div class="form-group">
            <div class="col-md-12 text-center">
              <label>Country:</label>
              <!-- <input type="text" class="form-control" name="country" formControlName="country"> -->
              <select class="form-control" name="country" formControlName="country">
                <option class="text-center" *ngFor="let country of countriesList" [value]="country">{{ country }}</option>
              </select>
            </div>
          </div>
          <div class="row form-group">
            <div class="col-md-6 text-center">
              <label>Vacation START:</label>
              <input type="date" class="form-control" name="start" formControlName="start">
            </div>
            <div class="col-md-6 text-center">
              <label>Vacation END:</label>
              <input type="date" class="form-control" name="end" formControlName="end">
            </div>
          </div>
          <div class="col-md-12 text-center">
            <hr>
            <label>Rate the vacation:</label>
            <ngb-rating [(rate)]="currentRate"></ngb-rating>
            <hr>
            <pre>Rate: <b>{{currentRate}}</b></pre>
          </div>
          <div class="form-group">
            <div class="col-md-12 text-center">
              <label>Description of the vacation:</label>
              <textarea type="text" rows="5" class="form-control" name="description" formControlName="description"></textarea>
            </div>
          </div>
         

          <div class="form-group text-center">
            <label>Post Picture</label>
            <img  [src]="tempPic" class="form-control img-fluid img-preview">
            <input type="file" class="form-control" accept="image/*" (change)="showUploadPic($event)" formControlName="postPic">
          </div>

          <br>

          <div class="form-group">
            <div class="col-md-12 text-center">
              <button type="submit" class="form-control">Submit</button>
            </div>
          </div>
        </form>
      </div>
    </div>
</div>
